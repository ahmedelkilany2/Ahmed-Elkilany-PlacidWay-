<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlacidWay Knowledge Chatbot</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#fff; --ink:#1b2430; --muted:#6a7686; --line:#e3e8ef;
    --brand:#0e7c86; --brand-ink:#fff; --user:#0e7c86; --warn:#fff8e6; --warn-line:#f0d9a0;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#0f141a; --card:#171e27; --ink:#e8edf3; --muted:#93a0b0; --line:#2a3441; --brand:#2bb3bf; --brand-ink:#04161a; --user:#1f8b95; --warn:#2a2412; --warn-line:#5a4a1c;}
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center}
  .app{width:100%;max-width:820px;height:100%;display:flex;flex-direction:column;padding:0 12px}
  header{padding:16px 4px 10px;display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700}
  header h1{font-size:1.05rem;margin:0}
  header p{margin:0;font-size:.82rem;color:var(--muted)}
  header .spacer{flex:1}
  button{font:inherit;cursor:pointer}
  .ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:.85rem}
  .ghost:hover{border-color:var(--brand);color:var(--brand)}
  #log{flex:1;overflow-y:auto;padding:8px 2px 16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:88%;padding:10px 14px;border-radius:16px;word-wrap:break-word}
  .msg p{margin:.3em 0}.msg ul{margin:.4em 0;padding-left:1.2em}
  .bot{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
  .me{background:var(--user);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
  .sources{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:.82rem;color:var(--muted)}
  .sources a{display:block;color:var(--brand);text-decoration:none;margin-top:3px}
  .sources a:hover{text-decoration:underline}
  .note{background:var(--warn);border:1px solid var(--warn-line);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:.82rem}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:8px 14px;font-size:.9rem;text-decoration:none;display:inline-block}
  .btn.alt{background:none;border:1px solid var(--brand);color:var(--brand)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:.88rem}
  .chip:hover{border-color:var(--brand)}
  .typing span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
  .typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
  form.input{display:flex;gap:8px;padding:8px 0 6px}
  textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 14px;font:inherit;max-height:120px}
  textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
  footer{font-size:.74rem;color:var(--muted);text-align:center;padding:2px 0 12px}
  dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:20px;max-width:380px;width:92%}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  dialog h2{margin:0 0 4px;font-size:1.1rem} dialog p{margin:0 0 12px;color:var(--muted);font-size:.85rem}
  dialog label{display:block;font-size:.82rem;margin:10px 0 3px}
  dialog input[type=text],dialog input[type=email]{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
  .check{display:flex;gap:8px;align-items:flex-start;font-size:.78rem;color:var(--muted);margin-top:12px}
  .hp{position:absolute;left:-9999px}
  .err{color:#d64545;font-size:.82rem;min-height:1.2em;margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">PW</div>
    <div><h1>PlacidWay Knowledge Chatbot</h1><p>Answers only from PlacidWay's pages, with sources</p></div>
    <div class="spacer"></div>
    <button class="ghost" id="leadBtn" type="button">Request a quote</button>
    <button class="ghost" id="clearBtn" type="button" title="Start over">New chat</button>
  </header>

  <div id="log" aria-live="polite"></div>

  <form class="input" id="form">
    <textarea id="q" rows="1" maxlength="1000" placeholder="Ask about ITC's cancer-care packages, prices, what's included…  (Spanish, Arabic and more work too)" aria-label="Your question"></textarea>
    <button class="btn" id="send" type="submit">Send</button>
  </form>
  <footer id="foot">Information only, not medical advice.</footer>
</div>

<dialog id="dlg">
  <form method="dialog" id="leadForm">
    <h2>Request a free quote</h2>
    <p>Leave your details and the PlacidWay team can follow up with you.</p>
    <label for="ln">Name</label><input type="text" id="ln" required maxlength="120" autocomplete="name">
    <label for="le">Email</label><input type="email" id="le" required maxlength="200" autocomplete="email">
    <label for="li">Treatment of interest (optional)</label><input type="text" id="li" maxlength="200" placeholder="e.g. Adenocarcinoma package">
    <input class="hp" type="text" id="lw" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="check"><input type="checkbox" id="lc"><label for="lc" style="margin:0">I agree to be contacted about my request.</label></div>
    <div class="err" id="lerr"></div>
    <div class="actions"><button class="btn" id="lsend" type="submit" value="send">Send</button><button class="btn alt" type="button" id="lcancel">Cancel</button></div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const log = $('#log'), q = $('#q'), form = $('#form');
let history = JSON.parse(sessionStorage.getItem('h') || '[]');
let disclaimerShown = sessionStorage.getItem('d') === '1';

const SUGGESTIONS = [
  "How much does the adenocarcinoma package cost in Tijuana?",
  "What's included in the out-patient vs in-patient program?",
  "¿Cuánto cuesta el tratamiento de cáncer suprarrenal?",
  "Is ozone therapy cheaper in Turkey or Mexico?"
];

const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function md(t){                       // tiny, safe markdown: escape first, then bold + bullet lists
  const lines = esc(t).split('\n'); let out = '', list = false;
  for (const l of lines){
    const b = l.match(/^\s*[-*]\s+(.*)/);
    if (b){ if(!list){out+='<ul>';list=true} out += '<li>'+inline(b[1])+'</li>'; }
    else { if(list){out+='</ul>';list=false} if(l.trim()) out += '<p>'+inline(l)+'</p>'; }
  }
  return out + (list?'</ul>':'');
}
const inline = s => s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');

function add(role, html, extra){
  const d = document.createElement('div');
  d.className = 'msg ' + (role==='user'?'me':'bot'); d.dir = 'auto'; d.innerHTML = html;
  if (extra) d.append(extra);
  log.append(d); log.scrollTop = log.scrollHeight; return d;
}

function render(r){
  const wrap = document.createElement('div');
  if (r.sources && r.sources.length){
    const s = document.createElement('div'); s.className = 'sources'; s.textContent = 'Sources';
    r.sources.forEach(x => { const a = document.createElement('a'); a.href = x.url; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = x.title + (x.section && x.section !== 'Overview' ? ' - ' + x.section : ''); s.append(a); });
    wrap.append(s);
  }
  if (r.disclaimer){ const n = document.createElement('div'); n.className = 'note'; n.textContent = r.disclaimer; wrap.append(n);
    disclaimerShown = true; sessionStorage.setItem('d','1'); }
  if (r.cta || r.show_lead_form){
    const a = document.createElement('div'); a.className = 'actions';
    if (r.show_lead_form){ const b = document.createElement('button'); b.className='btn'; b.textContent='Leave my details'; b.onclick = openLead; a.append(b); }
    if (r.cta){ const l = document.createElement('a'); l.className = 'btn alt'; l.href = r.cta.url; l.target = '_blank'; l.rel = 'noopener'; l.textContent = r.cta.label; a.append(l); }
    wrap.append(a);
  }
  return wrap;
}

async function ask(text){
  text = text.trim(); if (!text) return;
  document.querySelector('.chips')?.remove();
  add('user', esc(text)); q.value = ''; q.style.height = 'auto';
  const t = add('bot', '<div class="typing"><span></span><span></span><span></span></div>');
  $('#send').disabled = true;
  try{
    const res = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:text, history:history.slice(-8), disclaimer_shown:disclaimerShown})});
    if (res.status === 429) throw new Error('You are sending messages very quickly. Please wait a few seconds.');
    if (!res.ok) throw new Error('The service is starting up or unavailable. Please try again shortly.');
    const r = await res.json();
    t.remove(); add('bot', md(r.answer), render(r));
    history.push({role:'user', content:text}, {role:'assistant', content:r.answer});
    sessionStorage.setItem('h', JSON.stringify(history.slice(-12)));
  }catch(e){ t.remove(); add('bot', esc(e.message || 'Something went wrong.')); }
  finally{ $('#send').disabled = false; q.focus(); }
}

function start(){
  log.innerHTML = '';
  if (history.length){ history.forEach(m => add(m.role, m.role==='user' ? esc(m.content) : md(m.content))); return; }
  add('bot', md("Hi! Ask me about ITC Immunity Therapy Center's alternative cancer treatment packages in Tijuana: what's included, prices, and how they compare. I only answer from PlacidWay's pages, and I'll show you where each answer came from."));
  const c = document.createElement('div'); c.className = 'chips';
  SUGGESTIONS.forEach(s => { const b = document.createElement('button'); b.className='chip'; b.type='button'; b.textContent = s; b.onclick = () => ask(s); c.append(b); });
  log.append(c);
}

form.addEventListener('submit', e => { e.preventDefault(); ask(q.value); });
q.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); ask(q.value); } });
q.addEventListener('input', () => { q.style.height='auto'; q.style.height = Math.min(q.scrollHeight,120)+'px'; });
$('#clearBtn').onclick = () => { history = []; disclaimerShown = false; sessionStorage.clear(); start(); };

// ---- lead capture
const dlg = $('#dlg');
function openLead(){ $('#lerr').textContent=''; dlg.showModal(); }
$('#leadBtn').onclick = openLead; $('#lcancel').onclick = () => dlg.close();
$('#leadForm').addEventListener('submit', async e => {
  e.preventDefault(); $('#lerr').textContent = '';
  try{
    const res = await fetch('/api/lead', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
      name:$('#ln').value, email:$('#le').value, interest:$('#li').value, website:$('#lw').value, consent:$('#lc').checked,
      note: history.filter(m=>m.role==='user').slice(-3).map(m=>m.content).join(' | ')})});
    if (!res.ok) throw new Error((await res.json()).detail || 'Could not send.');
    dlg.close(); add('bot', md("Thank you! Your details were sent and the PlacidWay team can follow up with you."));
  }catch(err){ $('#lerr').textContent = err.message; }
});

fetch('/api/status').then(r=>r.json()).then(s=>{
  if (s.index_built_at) $('#foot').textContent = `Information only, not medical advice. Content from ${s.pages.length} PlacidWay pages · last refreshed ${new Date(s.index_built_at).toLocaleDateString()}`;
}).catch(()=>{});
start();
</script>
</body>
</html>
